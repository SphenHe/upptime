# Change these first
owner: SphenHe # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository
# runner: "[self-hosted, Linux, X64]" # The type of runner you're using

# Exact allowlist; GH_PAT is supplied separately by generated workflows.
secrets:
  - ALIYUN_HOST
  - ALIYUN_SSH_PORT
  - AZURE_VPS_SSH_PORT
  - AZURE_VPS_URL
  - COMPAQ_HOST
  - COMPAQ_SSH_PORT
  - QWEN_HEALTH_URL
  - RUSTDESK_ID_PORT
  - RUSTDESK_RELAY_PORT
  - TSINGHUA_VPS_SSH_PORT
  - TSINGHUA_VPS_URL

sites:
  # Display order: Service -> Pages -> Server; preserve order within each group.
  - name: Service | HedgeDoc
    url: https://doc.sphenhe.me
  - name: Service | Pastebin
    url: https://pastebin.sphenhe.me
  - name: Service | Vaultwarden
    url: https://vault.sphenhe.me
  - name: Service | IT Tools
    url: https://tools.sphenhe.me
    expectedStatusCodes: [200]
  - name: Service | Grafana
    url: https://grafana.sphenhe.me/api/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_regex_missing: '"database"\s*:\s*"ok"'
  - name: Service | API Proxy
    url: https://proxyapi.sphenhe.me
    expectedStatusCodes: [200]
  - name: Service | Qwen Gateway
    url: $QWEN_HEALTH_URL
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: OK
  - name: Service | RustDesk ID
    url: $COMPAQ_HOST
    port: $RUSTDESK_ID_PORT
    check: tcp-ping
    connectTimeout: 10
    requestTimeout: 10
  - name: Service | RustDesk Relay
    url: $COMPAQ_HOST
    port: $RUSTDESK_RELAY_PORT
    check: tcp-ping
    connectTimeout: 10
    requestTimeout: 10
  - name: Pages | Blog
    url: https://blog.sphenhe.me
  - name: Pages | MonkeyFile
    url: https://monkey.sphenhe.me
  - name: Pages | TsinghuaMemes
    url: https://memes.sphenhe.me
  - name: Server | Azure-VPS
    url: $AZURE_VPS_URL
    port: $AZURE_VPS_SSH_PORT
    check: "tcp-ping"
  - name: Server | Tsinghua-VPS
    url: $TSINGHUA_VPS_URL
    port: $TSINGHUA_VPS_SSH_PORT
    check: "tcp-ping"
  - name: Server | COMPAQ
    url: $COMPAQ_HOST
    port: $COMPAQ_SSH_PORT
    check: tcp
    connectTimeout: 10
    requestTimeout: 10
    __dangerous__body_down_if_regex_missing: ^SSH-2\.0-
  - name: Server | ALIYUN
    url: $ALIYUN_HOST
    port: $ALIYUN_SSH_PORT
    check: tcp
    connectTimeout: 10
    requestTimeout: 10
    __dangerous__body_down_if_regex_missing: ^SSH-2\.0-

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.sphenhe.me
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** of my sites, services and servers"
  introMessage: "A site based on [upptime](https://upptime.js.org), a GitHub-powered open-source uptime monitor and status page"
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
